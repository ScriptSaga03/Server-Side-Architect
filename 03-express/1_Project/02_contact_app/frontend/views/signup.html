<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact sign up</title>
</head>

<body>


    <div class="container">
    <form action="register" method="post" id="register-form" autocomplete="off">

        <div id="errorBox">
            <span class="errors"></span>
        </div>

        <!-- User Name -->
        <div class="form-container">
            <label for="name">Name: </label>
            <input type="text" id="name" placeholder="john...">
        </div>

        <!-- User Email -->
        <div class="form-container">
            <label for="email">Email: </label>
            <input type="email" id="email" placeholder="john@gmail.com">
        </div>

        <!-- User Password -->
        <div class="form-container">
            <label for="password">Password: </label>
            <input type="password" id="password" placeholder="strong password" autocomplete="new-password">
        </div>

        <button type="submit">Submit</button>

    </form>

    <a href="../views/signup.html"></a>
</div>


    <!-- JAVASCRIPT  -->
     <script  src="../script/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Notex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">Notex</a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#features">Features</a></li>
                <li><a href="index.html#pricing">Pricing</a></li>
            </ul>
        </nav>
        <div class="nav-actions">
            <a href="login.html" class="btn btn-outline active-link">Login</a>
            <a href="signup.html" class="btn btn-primary">Sign Up</a>
        </div>
    </header>

    <!-- Main Login View -->
    <main class="auth-container">
        <div class="auth-card">
            
            <!-- Header Section -->
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p class="subtitle">Please enter your details to sign in.</p>
            </div>

            <!-- Social Authentication Option -->
            <button class="btn-social">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.4 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.15 0 9.99 0 12s.45 3.85 1.24 5.42l4.04-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.6 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                Continue with Google
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>or email</span>
            </div>
              <span class="status-msg "></span>

            <!-- Primary Form -->
            <form action="#" method="POST" class="auth-form">
                
                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="name@company.com"  autocomplete="email">
                    <span class="status-msg"></span>
                </div>
                

                <div class="input-group">
                    <div class="label-wrapper">
                        <label for="login-pass">Password</label>
                        <a href="#" class="forgot-link">Forgot?</a>
                    </div>
                    <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
                    <span class="status-msg"></span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me for 30 days</span>
                    </label>
                    <span class="status-msg"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            </form>

            <!-- Redirect Option -->
            <div class="auth-switch">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>

        </div>
    </main>
</body>
</html>

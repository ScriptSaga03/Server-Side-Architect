<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Contact App</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <main class="auth-container">
        <h2>Create Account</h2>
       <!-- Error / Status Message Container -->
<div id="showErrors" class="status-msg"></div>

        <form id="signUpForm">
            <div class="form-group">
                <label for="userName">Full Name</label>
                <input 
                    type="text" 
                    id="userName" 
                    name="name" 
                    placeholder="John Doe" 
                    required 
                    minlength="3" 
                    maxlength="50"
                    autocomplete="name"
                    autocapitalize="words"
                    autofocus
                />
            </div>

            <div class="form-group">
                <label for="userEmail">Email Address</label>
                <input 
                    type="email" 
                    id="userEmail" 
                    name="email" 
                    placeholder="john@example.com" 
                    required 
                    autocomplete="email"
                />
            </div>

            <div class="form-group">
                <label for="userPass">Password</label>
                <input 
                    type="password" 
                    id="userPass" 
                    name="password" 
                    placeholder="••••••••" 
                    required 
                    minlength="8" 
                    autocomplete="new-password"
                />
                <small>Must contain uppercase, lowercase, number & symbol.</small>
            </div>

            <button type="submit" id="btnSignUp">Sign Up</button>
        </form>

        <p>Already have an account? <a href="./singIn.html">Sign In</a></p>
    </main>

    <script src="../script.js"></script>
</body>
</html>

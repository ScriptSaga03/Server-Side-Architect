<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Contact App</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="auth-container">
      <h2>Sign In</h2>

      <!-- Error / Status Message Container -->
      <div id="showErrors" class="status-msg"></div>

      <!-- STEP 1: Email & Password Form -->
      <form id="signInForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="john@example.com"
            required
            autocomplete="email"
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="loginPass">Password</label>
          <input
            type="password"
            id="loginPass"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="btnSignIn">Send OTP</button>
      </form>

      <!-- STEP 2: 2FA OTP Modal/Container (Hidden by default) -->
      <form id="otpForm" style="display: none">
        <h3>Enter Verification Code</h3>
        <p>6-digit OTP has been sent to your email.</p>

        <div class="form-group">
          <label for="loginOtp">OTP Code</label>
          <input
            type="text"
            id="loginOtp"
            name="otp"
            placeholder="123456"
            maxlength="6"
            required
            autocomplete="one-time-code"
          />
        </div>

        <button type="submit" id="btnVerifyOtp">Verify & Login</button>
      </form>

      <p>Don't have an account? <a href="./signUp.html">Sign Up</a></p>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
